<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 130" width="100%" height="130">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="violetTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="cyanTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <rect width="854" height="130" rx="10" fill="#0D1117" />

  <!-- Trophy Card 1: Open Source & Code Repositories -->
  <g transform="translate(20, 15)">
    <rect width="188" height="100" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2" />
    <circle cx="94" cy="38" r="22" fill="#7C3AED" fill-opacity="0.15" />
    <path d="M94 24 L98 32 L107 33 L100 39 L102 48 L94 43 L86 48 L88 39 L81 33 L90 32 Z" fill="url(#violetTrophy)" />
    <text x="94" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Repositories Master</text>
    <text x="94" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#A855F7">7 Production Repos</text>
  </g>

  <!-- Trophy Card 2: Commits & Consistency -->
  <g transform="translate(228, 15)">
    <rect width="188" height="100" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2" />
    <circle cx="94" cy="38" r="22" fill="#F59E0B" fill-opacity="0.15" />
    <circle cx="94" cy="38" r="10" fill="none" stroke="url(#goldTrophy)" stroke-width="3" />
    <path d="M94 33 L94 38 L98 40" stroke="url(#goldTrophy)" stroke-width="2.5" stroke-linecap="round" />
    <text x="94" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Commit Streak</text>
    <text x="94" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#FCD34D">Active Continuous Builder</text>
  </g>

  <!-- Trophy Card 3: Systems Architecture -->
  <g transform="translate(436, 15)">
    <rect width="188" height="100" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2" />
    <circle cx="94" cy="38" r="22" fill="#0284C7" fill-opacity="0.15" />
    <path d="M85 32 L94 27 L103 32 L103 44 L94 49 L85 44 Z" fill="none" stroke="url(#cyanTrophy)" stroke-width="2.5" />
    <circle cx="94" cy="38" r="3" fill="url(#cyanTrophy)" />
    <text x="94" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Systems Architect</text>
    <text x="94" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#67E8F9">High-Concurrency Go &amp; ML</text>
  </g>

  <!-- Trophy Card 4: Engineering Excellence -->
  <g transform="translate(644, 15)">
    <rect width="188" height="100" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2" />
    <circle cx="94" cy="38" r="22" fill="#A855F7" fill-opacity="0.15" />
    <path d="M88 44 L94 27 L100 44 L84 34 L104 34 Z" fill="url(#purpleBorder)" />
    <text x="94" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">FAANG Grade Quality</text>
    <text x="94" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#C084FC">Senior Staff Level</text>
  </g>
</svg>
