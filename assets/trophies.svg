<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 130" width="100%" height="130">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1613" />
      <stop offset="100%" stop-color="#140F0D" />
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bronzeTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDB892" />
      <stop offset="100%" stop-color="#9C6644" />
    </linearGradient>
    <linearGradient id="caramelTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CCB2" />
      <stop offset="100%" stop-color="#7F5539" />
    </linearGradient>
    <linearGradient id="copperTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#8C532B" />
    </linearGradient>
  </defs>

  <rect width="854" height="130" rx="10" fill="#140F0D" stroke="#3E2E25" stroke-width="1.2" />

  <!-- Trophy Card 1: Repositories Master -->
  <g transform="translate(20, 15)">
    <rect width="188" height="100" rx="8" fill="url(#cardBg)" stroke="#4A3525" stroke-width="1.2" />
    <circle cx="94" cy="38" r="22" fill="#9C6644" fill-opacity="0.18" />
    <path d="M94 24 L98 32 L107 33 L100 39 L102 48 L94 43 L86 48 L88 39 L81 33 L90 32 Z" fill="url(#bronzeTrophy)" />
    <text x="94" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Repositories Master</text>
    <text x="94" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#DDB892">7 Production Repos</text>
  </g>

  <!-- Trophy Card 2: Commit Streak -->
  <g transform="translate(228, 15)">
    <rect width="188" height="100" rx="8" fill="url(#cardBg)" stroke="#4A3525" stroke-width="1.2" />
    <circle cx="94" cy="38" r="22" fill="#D97706" fill-opacity="0.18" />
    <circle cx="94" cy="38" r="10" fill="none" stroke="url(#goldTrophy)" stroke-width="3" />
    <path d="M94 33 L94 38 L98 40" stroke="url(#goldTrophy)" stroke-width="2.5" stroke-linecap="round" />
    <text x="94" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Commit Streak</text>
    <text x="94" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#FCD34D">Active Continuous Builder</text>
  </g>

  <!-- Trophy Card 3: Systems Architecture -->
  <g transform="translate(436, 15)">
    <rect width="188" height="100" rx="8" fill="url(#cardBg)" stroke="#4A3525" stroke-width="1.2" />
    <circle cx="94" cy="38" r="22" fill="#7F5539" fill-opacity="0.22" />
    <path d="M85 32 L94 27 L103 32 L103 44 L94 49 L85 44 Z" fill="none" stroke="url(#caramelTrophy)" stroke-width="2.5" />
    <circle cx="94" cy="38" r="3" fill="url(#caramelTrophy)" />
    <text x="94" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Systems Architect</text>
    <text x="94" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#E6CCB2">High-Concurrency Go &amp; ML</text>
  </g>

  <!-- Trophy Card 4: Engineering Excellence -->
  <g transform="translate(644, 15)">
    <rect width="188" height="100" rx="8" fill="url(#cardBg)" stroke="#4A3525" stroke-width="1.2" />
    <circle cx="94" cy="38" r="22" fill="#8C532B" fill-opacity="0.2" />
    <path d="M88 44 L94 27 L100 44 L84 34 L104 34 Z" fill="url(#copperTrophy)" />
    <text x="94" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">FAANG Grade Quality</text>
    <text x="94" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#E0A96D">Senior Staff Level</text>
  </g>
</svg>
