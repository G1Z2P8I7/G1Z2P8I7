<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 200" width="100%" height="200">
  <defs>
    <linearGradient id="actArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C6644" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#7F5539" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#140F0D" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="actLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F5539" />
      <stop offset="35%" stop-color="#9C6644" />
      <stop offset="70%" stop-color="#B08968" />
      <stop offset="100%" stop-color="#E6CCB2" />
    </linearGradient>
    <filter id="actGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#B08968" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="854" height="200" rx="10" fill="#140F0D" stroke="#3E2E25" stroke-width="1.2" />

  <!-- Header stats inside card -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="35" y="32" font-size="14" font-weight="700" fill="#FAF0E6">Contribution &amp; Deployment Momentum</text>
    <text x="35" y="48" font-size="11" font-weight="500" fill="#A1887F">High frequency development cadence across Distributed Systems &amp; AI engines</text>
  </g>

  <!-- Horizontal Grid Lines -->
  <g stroke="#2C211B" stroke-width="1" stroke-dasharray="3,3">
    <line x1="35" y1="75" x2="819" y2="75" />
    <line x1="35" y1="110" x2="819" y2="110" />
    <line x1="35" y1="145" x2="819" y2="145" />
    <line x1="35" y1="170" x2="819" y2="170" stroke-dasharray="none" stroke="#3E2E25" />
  </g>

  <!-- Gradient Area under curve -->
  <path d="M 45 155 Q 110 160 170 140 T 290 120 T 410 95 T 530 115 T 650 75 T 770 60 L 810 52 L 810 170 L 45 170 Z" fill="url(#actArea)" />

  <!-- High-fidelity bezier curve line in Caramel & Beige -->
  <path d="M 45 155 Q 110 160 170 140 T 290 120 T 410 95 T 530 115 T 650 75 T 770 60 L 810 52" fill="none" stroke="url(#actLine)" stroke-width="3" filter="url(#actGlow)" stroke-linecap="round" />

  <!-- Data point nodes -->
  <g fill="#DDB892" stroke="#FFFFFF" stroke-width="2">
    <circle cx="170" cy="140" r="4.5" />
    <circle cx="290" cy="120" r="4.5" />
    <circle cx="410" cy="95" r="4.5" />
    <circle cx="530" cy="115" r="4.5" />
    <circle cx="650" cy="75" r="5" fill="#E6CCB2" />
    <circle cx="770" cy="60" r="5" fill="#EDE0D4" />
    <circle cx="810" cy="52" r="5.5" fill="#FAF0E6" />
  </g>

  <!-- Month Axis Labels in Warm Taupe -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#A1887F">
    <text x="45" y="188">May</text>
    <text x="170" y="188">Jun</text>
    <text x="290" y="188">Jul</text>
    <text x="410" y="188">Aug</text>
    <text x="530" y="188">Sep</text>
    <text x="650" y="188">Oct</text>
    <text x="770" y="188">Nov</text>
  </g>
</svg>
